name: Build Cross-Platform Native Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows Desktop Installer (.exe)
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_DEMO_MODE: 'false'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Compile Windows NSIS Installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: silaye-windows-installer-x64
          path: dist-electron/*.exe
          if-no-files-found: error

  build-android-apk:
    name: Build Android Native Package (.apk)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_DEMO_MODE: 'false'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: silaye-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
